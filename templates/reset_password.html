{% extends "base.html" %}
{% block title %}Reset password — Lunelle{% endblock %}
{% block content %}
<section class="simple-auth-shell single-auth">
  <form class="simple-auth-card" method="post">
    <div class="auth-title"><span>LOCAL RECOVERY</span><h2>Reset password</h2><p>This only works directly on the computer running Lunelle.</p></div>
    <label><span>Username</span><input name="identifier" value="{{ identifier or '' }}" required autocomplete="username" autofocus></label>
    <label><span>New password</span><div class="simple-password"><input id="resetPassword" name="password" type="password" minlength="8" required autocomplete="new-password"><button type="button" data-password-toggle="resetPassword">Show</button></div></label>
    <label><span>Confirm password</span><input name="confirm_password" type="password" minlength="8" required autocomplete="new-password"></label>
    <button class="simple-primary" type="submit">Reset password</button>
    <div class="auth-links one"><a href="{{ url_for('login') }}">Back to login</a></div>
  </form>
</section>
{% endblock %}
